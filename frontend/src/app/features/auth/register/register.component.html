<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">NoobToDev</div>
    <p class="eyebrow">Primeiros passos</p>
    <h1>Criar conta</h1>

    <div *ngIf="errorMessage()" class="alert alert-danger" role="alert">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label for="register-nome" class="form-label">Nome</label>
        <input id="register-nome" type="text" class="form-control" formControlName="nome" placeholder="Seu nome" />
      </div>

      <div class="mb-3">
        <label for="register-email" class="form-label">E-mail</label>
        <input id="register-email" type="email" class="form-control" formControlName="email" placeholder="nome@email.com" />
      </div>

      <div class="mb-3">
        <label for="register-senha" class="form-label">Senha</label>
        <input id="register-senha" type="password" class="form-control" formControlName="senha" placeholder="Mínimo 6 caracteres" />
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loading() || form.invalid">
        <span *ngIf="loading()">Criando conta...</span>
        <span *ngIf="!loading()">Cadastrar</span>
      </button>
    </form>

    <p class="auth-switch">
      Já possui conta?
      <a routerLink="/login">Entrar</a>
    </p>
  </div>
</section>
